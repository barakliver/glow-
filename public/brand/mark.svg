<svg xmlns="http://www.w3.org/2000/svg" viewBox="104 24 304 448" width="304" height="448" role="img" aria-label="GLoW">
  <defs>
    <linearGradient id="skinEdge" gradientUnits="userSpaceOnUse" x1="110" y1="50" x2="410" y2="470">
      <stop offset="0"    stop-color="#F2FFC6"/>
      <stop offset="0.42" stop-color="#AEE33E"/>
      <stop offset="1"    stop-color="#3B5D0D"/>
    </linearGradient>
    <linearGradient id="peel" gradientUnits="userSpaceOnUse" x1="120" y1="60" x2="400" y2="460">
      <stop offset="0"    stop-color="#53801C"/>
      <stop offset="0.55" stop-color="#2A450B"/>
      <stop offset="1"    stop-color="#0F1A05"/>
    </linearGradient>
    <radialGradient id="flesh" cx="0.36" cy="0.22" r="0.96">
      <stop offset="0"    stop-color="#FEFFFA"/>
      <stop offset="0.28" stop-color="#F5FEDC"/>
      <stop offset="0.64" stop-color="#D9F685"/>
      <stop offset="1"    stop-color="#A4D62F"/>
    </radialGradient>
    <linearGradient id="figure" gradientUnits="userSpaceOnUse" x1="180" y1="80" x2="340" y2="440">
      <stop offset="0"    stop-color="#547E1A"/>
      <stop offset="0.42" stop-color="#1B2C0B"/>
      <stop offset="1"    stop-color="#050903"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0"   stop-color="#C7FF4A" stop-opacity="0.20"/>
      <stop offset="0.6" stop-color="#C7FF4A" stop-opacity="0.05"/>
      <stop offset="1"   stop-color="#C7FF4A" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <path id="fruit" d="M 256 62 C 318 62 388 148 394 254 C 400 360 338 458 256 458 C 174 458 112 360 118 254 C 124 148 194 62 256 62 Z"/>
    <path id="cut"   d="M 256 98 C 308 98 360 172 364 256 C 368 348 322 426 256 426 C 190 426 144 348 148 256 C 152 172 204 98 256 98 Z"/>
    <clipPath id="face"><use href="#cut"/></clipPath>

    <!-- Shoulders, a cinched waist, a flared hip: one line does the woman and
         the fruit at the same time. Nothing here carries its own colour, so the
         figure can be drawn twice - once as its own shadow. -->
    <g id="fig" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 224 176 L 188 194 L 206 138" fill="none" stroke-width="21"/>
      <path d="M 288 176 L 324 194 L 306 138" fill="none" stroke-width="21"/>
      <ellipse cx="204" cy="177" rx="23" ry="13" transform="rotate(-27 204 177)" stroke="none"/>
      <ellipse cx="308" cy="177" rx="23" ry="13" transform="rotate(27 308 177)" stroke="none"/>
      <circle cx="206" cy="136" r="12" stroke="none"/>
      <circle cx="306" cy="136" r="12" stroke="none"/>
      <circle cx="273" cy="105" r="11" stroke="none"/>
      <ellipse cx="256" cy="122" rx="17" ry="21" stroke="none"/>
      <rect x="249" y="136" width="14" height="28" rx="6" stroke="none"/>
      <path d="M 216 168 C 228 158 240 156 256 156 C 272 156 284 158 296 168 C 302 180 305 192 303 202 C 300 220 274 222 274 238 C 274 256 309 262 307 284 C 305 302 293 310 278 310 C 268 310 262 306 256 306 C 250 306 244 310 234 310 C 219 310 207 302 205 284 C 203 262 238 256 238 238 C 238 222 212 220 209 202 C 207 192 210 180 216 168 Z" stroke="none"/>
      <path d="M 240 286 C 236 320 233 342 234 356" fill="none" stroke-width="33"/>
      <path d="M 272 286 C 276 320 279 342 278 356" fill="none" stroke-width="33"/>
      <path d="M 234 356 C 236 388 238 412 240 428" fill="none" stroke-width="21"/>
      <path d="M 278 356 C 276 388 274 412 272 428" fill="none" stroke-width="21"/>
      <ellipse cx="244" cy="432" rx="14" ry="8" stroke="none"/>
      <ellipse cx="268" cy="432" rx="14" ry="8" stroke="none"/>
    </g>
  </defs>

  <path d="M 252 74 C 240 62 240 44 252 36 C 264 28 280 34 282 48 C 284 62 272 72 258 76 Z" fill="url(#skinEdge)"/>
  <use href="#fruit" fill="url(#peel)" stroke="url(#skinEdge)" stroke-width="12"/>
  <use href="#cut" fill="url(#flesh)"/>

  <g clip-path="url(#face)">
    <g fill="none" stroke="#A4D62F" stroke-opacity="0.16" stroke-width="6" stroke-linecap="round">
      <path d="M 156 206 Q 180 214 194 226"/>
      <path d="M 356 206 Q 332 214 318 226"/>
      <path d="M 150 292 Q 176 292 192 288"/>
      <path d="M 362 292 Q 336 292 320 288"/>
      <path d="M 182 372 Q 204 356 216 346"/>
      <path d="M 330 372 Q 308 356 296 346"/>
    </g>
    <ellipse cx="198" cy="186" rx="92" ry="46" transform="rotate(-40 198 186)" fill="#FFFFFF" fill-opacity="0.18"/>
    <use href="#cut" fill="none" stroke="#7FA828" stroke-opacity="0.30" stroke-width="14"/>
  </g>

  <!-- She stands where the stone would sit: the heart of the fruit. -->
  <g transform="translate(256,262) scale(0.82) translate(-256,-262)" clip-path="url(#face)">
    <g fill="#2C4610" stroke="#2C4610" opacity="0.34" filter="url(#soft)" transform="translate(10,12)">
      <use href="#fig"/>
    </g>
    <g fill="url(#figure)" stroke="url(#figure)">
      <use href="#fig"/>
    </g>
  </g>
</svg>
