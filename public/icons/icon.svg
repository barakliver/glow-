<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="GLoW">
  <defs>
    <linearGradient id="skin" gradientUnits="userSpaceOnUse" x1="140" y1="70" x2="380" y2="450">
      <stop offset="0"    stop-color="#44601D"/>
      <stop offset="0.5"  stop-color="#22320F"/>
      <stop offset="1"    stop-color="#0B1205"/>
    </linearGradient>
    <linearGradient id="rind" gradientUnits="userSpaceOnUse" x1="150" y1="90" x2="370" y2="430">
      <stop offset="0" stop-color="#B0E238"/>
      <stop offset="1" stop-color="#3E5A10"/>
    </linearGradient>
    <radialGradient id="flesh" cx="0.47" cy="0.40" r="0.72">
      <stop offset="0"    stop-color="#FAFFE8"/>
      <stop offset="0.38" stop-color="#E8FCA8"/>
      <stop offset="0.76" stop-color="#C2EA4A"/>
      <stop offset="1"    stop-color="#8FBF23"/>
    </radialGradient>
    <radialGradient id="pit" cx="0.33" cy="0.26" r="0.92">
      <stop offset="0"    stop-color="#7A5027"/>
      <stop offset="0.5"  stop-color="#452A11"/>
      <stop offset="1"    stop-color="#150B03"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.46" r="0.6">
      <stop offset="0" stop-color="#C7FF4A" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#C7FF4A" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="face">
      <path d="M256 112c-27 0-47 25-47 58 0 23-12 35-24 49-19 25-30 53-30 85 0 61 45 103 101 103s101-42 101-103c0-32-11-60-30-85-12-14-24-26-24-49 0-33-20-58-47-58z"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0D100F"/>
  <circle cx="256" cy="250" r="200" fill="url(#halo)"/>

  <!-- dark waxy skin, left thick enough to read as a real rind -->
  <path d="M256 58c-37 0-64 35-64 81 0 29-16 43-32 63-23 30-36 66-36 104 0 76 59 130 132 130s132-54 132-130c0-38-13-74-36-104-16-20-32-34-32-63 0-46-27-81-64-81z"
        fill="url(#skin)"/>
  <g fill="#8FBE24" opacity="0.12">
    <circle cx="186" cy="150" r="4"/><circle cx="326" cy="138" r="3"/><circle cx="146" cy="268" r="4.5"/>
    <circle cx="368" cy="242" r="3.5"/><circle cx="166" cy="366" r="4"/><circle cx="350" cy="352" r="4.5"/>
    <circle cx="256" cy="428" r="4"/><circle cx="202" cy="412" r="3"/><circle cx="312" cy="418" r="3.5"/>
  </g>

  <!-- bright rind: a rim, not a fill -->
  <path d="M256 84c-31 0-54 29-54 67 0 25-13 38-27 55-20 27-32 58-32 93 0 67 52 114 113 114s113-47 113-114c0-35-12-66-32-93-14-17-27-30-27-55 0-38-23-67-54-67z"
        fill="url(#rind)"/>

  <!-- the cut face -->
  <path d="M256 112c-27 0-47 25-47 58 0 23-12 35-24 49-19 25-30 53-30 85 0 61 45 103 101 103s101-42 101-103c0-32-11-60-30-85-12-14-24-26-24-49 0-33-20-58-47-58z"
        fill="url(#flesh)"/>

  <!-- The flesh is cut with the grain. Avocado strands and muscle fibre run the
       same way: gathered at the ends, spread across the belly. Each bundle gets
       its own shadow and highlight so the face reads as relief, not pattern. -->
  <g clip-path="url(#face)">
    <g fill="#A4D02E" opacity="0.34">
      <path d="M256 118c-16 30-26 64-28 100-2 34 4 64 18 88-30-20-48-54-48-98 0-36 20-68 58-90z"/>
      <path d="M256 118c16 30 26 64 28 100 2 34-4 64-18 88 30-20 48-54 48-98 0-36-20-68-58-90z"/>
      <path d="M186 206c-18 28-27 60-27 94 0 33 10 60 28 78-8-28-11-57-9-86 2-31 6-60 8-86z"/>
      <path d="M326 206c18 28 27 60 27 94 0 33-10 60-28 78 8-28 11-57 9-86-2-31-6-60-8-86z"/>
      <path d="M202 378c8 28 22 50 42 64-23-3-43-15-56-33z"/>
      <path d="M310 378c-8 28-22 50-42 64 23-3 43-15 56-33z"/>
    </g>
    <g fill="none" stroke="#FBFFEC" stroke-opacity="0.44" stroke-width="3.2" stroke-linecap="round">
      <path d="M250 124c-16 30-26 64-28 100"/>
      <path d="M262 124c16 30 26 64 28 100"/>
      <path d="M190 212c-16 26-24 56-24 88"/>
      <path d="M322 212c16 26 24 56 24 88"/>
      <path d="M208 382c7 26 19 46 36 60"/>
      <path d="M304 382c-7 26-19 46-36 60"/>
    </g>
    <g fill="none" stroke="#6A9317" stroke-opacity="0.34" stroke-width="2.6" stroke-linecap="round">
      <path d="M236 132c-17 30-27 64-29 98"/>
      <path d="M276 132c17 30 27 64 29 98"/>
      <path d="M174 226c-14 24-21 52-21 82"/>
      <path d="M338 226c14 24 21 52 21 82"/>
      <path d="M224 388c6 24 16 43 32 56"/>
      <path d="M288 388c-6 24-16 43-32 56"/>
    </g>
  </g>

  <!-- the stone: dense, matte, sitting in its hollow -->
  <ellipse cx="256" cy="322" rx="78" ry="68" fill="#1A1107" opacity="0.45"/>
  <circle cx="256" cy="310" r="68" fill="url(#pit)"/>
  <circle cx="256" cy="310" r="68" fill="none" stroke="#0A0702" stroke-opacity="0.55" stroke-width="5"/>
  <path d="M215 276a58 58 0 0 1 39-21" fill="none" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="11" stroke-linecap="round"/>

</svg>
