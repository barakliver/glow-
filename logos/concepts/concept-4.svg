<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="glow-title">
  <title id="glow-title">GLoW — G monogram as an avocado cross-section with a dancer in the counter</title>

  <rect width="512" height="512" fill="#0D100F"/>

  <g id="icon">
    <!-- G stroke, outer band: avocado rind. Annulus r196→r152, opened 0°→-58° for the letter aperture. -->
    <path d="M 452 256
             A 196 196 0 1 0 359.86 422.22
             L 336.55 384.9
             A 152 152 0 1 1 408 256 Z" fill="#2A450B"/>

    <!-- Same band inset to r178: the pale flesh, leaving the rind as a 18u skin on the outside. -->
    <path d="M 434 256
             A 178 178 0 1 0 350.33 406.95
             L 336.55 384.9
             A 152 152 0 1 1 408 256 Z" fill="#EAFDB4"/>

    <!-- The G's crossbar, drawn as a leaf: flat letterform top on the horizontal axis,
         tapered tip reaching into the counter, leaf belly returning to the outer circle. -->
    <path d="M 452 256
             L 340 256
             Q 310 256 304 272
             C 334 292 384 306 445.52 306
             A 196 196 0 0 0 452 256 Z" fill="#C7FF4A"/>

